[package]
name = "plotter"
version = "0.6.1"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
csv = "1.4.0"
encoding_rs = "0.8.42"
encoding_rs_io = "0.1.8"
plotters = "0.3.7"
rand = "0.10.3"
rpassword = "7.5.5"
self_update = "1.3.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_ini = "0.2.0"

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"
